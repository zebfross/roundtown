<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Round Town</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#4b8f43;
    -webkit-user-select:none;user-select:none;touch-action:none;cursor:none;}
  #c{display:block;width:100vw;height:100vh;}
  #tk{display:block;width:min(42vw,320px);height:auto;}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:2.2vh;background:#5aa0e8;color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;text-align:center;z-index:10;}
  #start h1{margin:0;font-size:min(13vw,8.5rem);letter-spacing:.04em;
    text-shadow:0 .45vh 0 #2b6bb0,0 1.2vh 2.4vh rgba(0,0,0,.35);}
  #start p{margin:0;font-size:min(4.2vw,2.1rem);font-weight:700;opacity:.95;}
  #start .blink{animation:b 1.15s ease-in-out infinite;}
  #start .sub{font-size:min(2.4vw,1.05rem);font-weight:600;opacity:.62;margin-top:-.6vh;}
  @keyframes b{0%,100%{opacity:1}50%{opacity:.35}}
  #start.gone{display:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="start">
  <h1>ROUND TOWN</h1>
  <canvas id="tk" width="360" height="200"></canvas>
  <p class="blink">PRESS ANY BUTTON</p>
  <p class="sub">Menu button, or Esc, for settings</p>
</div>
<script>
'use strict';

/* ============================== config ============================== */
const BLOCK   = 540;       // road grid spacing. roads run along every multiple of BLOCK.
const ROAD_W  = 156;
const VIEW_H  = 500;       // world units visible vertically (zoomed in for TV viewing)
const MAXV    = 345;       // truck top speed (units/sec)
const ACCEL   = 430;
const DEADZONE= 0.22;
const TURN    = 2.6;       // radians/sec when steering left or right
const KEEP    = 6;         // cells kept loaded either side of the truck before eviction

/* Recorded sounds. Each falls back to the synthesised version in SFX if the
   file is missing or fails to decode, so the game still works from the HTML
   file alone. Turn them down/up with `gain`. */
const SAMPLE_SRC={
  horn:  {url:'assets/car-horn.mp3',     gain:0.30},
  police:{url:'assets/police-siren.mp3', gain:0.22, loop:true},
};
const SAMPLES={};

const C = {
  grass:'#7cc46a', grass2:'#71bb5f', grass3:'#86cd75',
  road:'#71767f', roadEdge:'#8b909a', line:'#f5e27a',
  water:'#54c4e6', sand:'#f0dda4', walk:'#c6cad1',
};

/* ============================== helpers ============================== */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=mulberry32(20260905);            // effects only (particles, spin)
const rr=(a,b)=>a+rnd()*(b-a);

function roundRect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.closePath();
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const r=(n>>16)&255,gg=(n>>8)&255,b=n&255;
  const f=v=>clamp(Math.round(amt<0?v*(1+amt):v+(255-v)*amt),0,255);
  return '#'+((f(r)<<16)|(f(gg)<<8)|f(b)).toString(16).padStart(6,'0');
}

/* ============================== audio ============================== */
const A={ctx:null,master:null,engine:null,siren:null,voices:0};

function audioInit(){
  if(A.ctx) return;
  const Ctor=window.AudioContext||window.webkitAudioContext;
  if(!Ctor) return;
  A.ctx=new Ctor();
  A.master=A.ctx.createGain(); A.master.gain.value=0.5;
  A.master.connect(A.ctx.destination);
  const o=A.ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=58;
  const f=A.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=340; f.Q.value=4;
  const g=A.ctx.createGain(); g.gain.value=0;
  o.connect(f); f.connect(g); g.connect(A.master); o.start();
  A.engine={o,f,g};
  loadSamples();
}

function loadSamples(){
  for(const id in SAMPLE_SRC){
    fetch(SAMPLE_SRC[id].url)
      .then(r=>r.ok?r.arrayBuffer():Promise.reject(r.status))
      .then(b=>A.ctx.decodeAudioData(b))
      .then(buf=>{ SAMPLES[id]=SAMPLE_SRC[id].loop?seamlessLoop(buf,0.06):buf; })
      .catch(()=>{});          // stay on the synthesised sound
  }
}

/* A clip that just loops end-to-start clicks once per cycle unless its ends
   happen to line up. This trims the last `fade` seconds off and crossfades
   them back over the start, so the join is continuous. */
function seamlessLoop(buf,fade){
  const n=Math.min(Math.floor(fade*buf.sampleRate),Math.floor(buf.length/4));
  const len=buf.length-n;
  const out=A.ctx.createBuffer(buf.numberOfChannels,len,buf.sampleRate);
  for(let ch=0;ch<buf.numberOfChannels;ch++){
    const s=buf.getChannelData(ch), d=out.getChannelData(ch);
    for(let i=0;i<len;i++) d[i]=s[i];
    for(let i=0;i<n;i++){
      const t=i/n;
      d[i]=s[len+i]*(1-t)+s[i]*t;
    }
  }
  return out;
}

// returns false if the sample is not available, so callers can fall back
function playSample(id){
  const def=SAMPLE_SRC[id], buf=SAMPLES[id];
  if(!buf||!A.ctx) return false;
  const s=A.ctx.createBufferSource(); s.buffer=buf;
  const gn=A.ctx.createGain(); gn.gain.value=def.gain;
  s.connect(gn); gn.connect(A.master); s.start();
  return true;
}
function audioResume(){ if(A.ctx&&A.ctx.state==='suspended') A.ctx.resume(); }

function tone(op){
  if(!A.ctx||A.voices>14) return;
  const ctx=A.ctx,t0=ctx.currentTime,dur=op.dur||0.3;
  const o=ctx.createOscillator(); o.type=op.type||'sine';
  o.frequency.setValueAtTime(op.f0,t0);
  if(op.f1) o.frequency.exponentialRampToValueAtTime(Math.max(20,op.f1),t0+dur*(op.slide||1));
  if(op.vib){
    const l=ctx.createOscillator(); l.type='sine'; l.frequency.value=op.vib;
    const lg=ctx.createGain(); lg.gain.value=op.vibAmt||40;
    l.connect(lg); lg.connect(o.frequency); l.start(t0); l.stop(t0+dur+0.05);
  }
  let node=o;
  if(op.filter){
    const f=ctx.createBiquadFilter(); f.type=op.filter; f.frequency.value=op.fc||900;
    if(op.q) f.Q.value=op.q;
    node.connect(f); node=f;
  }
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(op.vol||0.15,t0+(op.atk||0.012));
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  node.connect(g); g.connect(A.master);
  A.voices++; o.onended=()=>{A.voices--;};
  o.start(t0+(op.delay||0)); o.stop(t0+dur+0.06+(op.delay||0));
}

function noiseBurst(dur,type,fc,vol){
  if(!A.ctx) return;
  const ctx=A.ctx,t0=ctx.currentTime;
  const n=Math.max(1,Math.floor(ctx.sampleRate*dur));
  const buf=ctx.createBuffer(1,n,ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=ctx.createBufferSource(); s.buffer=buf;
  const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=fc;
  const g=ctx.createGain();
  g.gain.setValueAtTime(vol,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f); f.connect(g); g.connect(A.master); s.start(t0);
}

const SFX={
  horn(){ tone({type:'square',f0:392,dur:0.42,vol:0.16,filter:'lowpass',fc:2200});
          tone({type:'square',f0:523,dur:0.42,vol:0.13,filter:'lowpass',fc:2200}); },
  moo(){  tone({type:'sawtooth',f0:200,f1:104,dur:0.62,vol:0.17,filter:'lowpass',fc:760,q:5,atk:0.06}); },
  cluck(){for(let i=0;i<3;i++) tone({type:'square',f0:880+i*70,f1:600,dur:0.07,vol:0.09,
            filter:'bandpass',fc:1500,delay:i*0.085});},
  quack(){tone({type:'sawtooth',f0:330,f1:250,dur:0.2,vol:0.14,vib:26,vibAmt:60,filter:'bandpass',fc:1100,q:3});},
  boing(){tone({type:'sine',f0:620,f1:150,dur:0.34,vol:0.15,slide:0.8});},
  bonk(){ noiseBurst(0.1,'lowpass',1400,0.12); tone({type:'sine',f0:150,f1:70,dur:0.16,vol:0.13});},
  clang(){tone({type:'square',f0:700,dur:0.26,vol:0.09,filter:'highpass',fc:500});
          tone({type:'square',f0:1043,dur:0.2,vol:0.07,filter:'highpass',fc:500});
          noiseBurst(0.12,'highpass',2200,0.07);},
  rustle(){noiseBurst(0.3,'highpass',2400,0.085);},
  chirp(){tone({type:'sine',f0:2100,f1:2900,dur:0.08,vol:0.09,slide:0.7});
          tone({type:'sine',f0:2400,f1:3100,dur:0.08,vol:0.08,delay:0.11,slide:0.7});},
  thunk(){ tone({type:'sine',f0:190,f1:90,dur:0.22,vol:0.12});
           noiseBurst(0.14,'lowpass',700,0.09);},
  splash(){noiseBurst(0.3,'bandpass',1200,0.12);},
  click(){tone({type:'square',f0:1200,f1:1600,dur:0.06,vol:0.07});},
  yay(){ [523,659,784,1047].forEach((f,i)=>
           tone({type:'triangle',f0:f,dur:0.3,vol:0.12,delay:i*0.085})); },
  nope(){ tone({type:'sine',f0:330,f1:220,dur:0.24,vol:0.10}); },
};

function sirenOn(){
  if(!A.ctx||A.siren) return;
  const ctx=A.ctx;
  const sid=V.sirenSample;
  if(sid&&SAMPLES[sid]){                       // looped recording
    const s=ctx.createBufferSource();
    s.buffer=SAMPLES[sid]; s.loop=true;
    const gn=ctx.createGain(); gn.gain.value=0.0001;
    gn.gain.linearRampToValueAtTime(SAMPLE_SRC[sid].gain,ctx.currentTime+0.1);
    s.connect(gn); gn.connect(A.master); s.start();
    A.siren={src:s,g:gn,sample:true};
    return;
  }
  const v=V.tone;
  const o=ctx.createOscillator(); o.type=v.type; o.frequency.value=v.f;
  const lfo=ctx.createOscillator(); lfo.type=v.lfo; lfo.frequency.value=v.rate;
  const lg=ctx.createGain(); lg.gain.value=v.depth;
  lfo.connect(lg); lg.connect(o.frequency);
  const g=ctx.createGain(); g.gain.value=0.0001;
  g.gain.linearRampToValueAtTime(0.075,ctx.currentTime+0.1);
  o.connect(g); g.connect(A.master);
  o.start(); lfo.start();
  A.siren={o,lfo,g};
}
function sirenOff(){
  if(!A.siren) return;
  const s=A.siren, t=A.ctx.currentTime;
  s.g.gain.cancelScheduledValues(t);
  s.g.gain.setValueAtTime(s.g.gain.value,t);
  s.g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
  if(s.sample) s.src.stop(t+0.24);
  else { s.o.stop(t+0.24); s.lfo.stop(t+0.24); }
  A.siren=null;
}

/* ============================== input ============================== */
const IN={x:0,y:0,boost:0,rev:0};
/* Two movement systems. 'turn' is up/down thrust with left/right steering,
   which makes it much easier to line up on something and nudge it. 'point'
   is the original: shove the stick the way you want to go and it heads there.
   Switch with ?drive=point or ?drive=turn on the URL; the choice sticks. */
let driveMode='turn';
try{
  const q=new URLSearchParams(location.search).get('drive');
  const m=q||localStorage.getItem('roundtown.drive');
  if(m==='point'||m==='turn') driveMode=m;
  if(q) localStorage.setItem('roundtown.drive',q);
}catch(_){}

let settingsOpen=false, settingsRow=0;

/* Edge on Xbox delivers the D-pad as gamepad buttons AND as synthesised arrow
   keys, and key-repeat kept winning the "last input" race, so the hints showed
   keycaps on a console. On Xbox the controller is the only input there is. */
const IS_XBOX=/xbox/i.test(navigator.userAgent||'');
let inputKind=IS_XBOX?'pad':'key';   // 'key' | 'pad' | 'ps'
const recentKeys=[];
function padKind(p){
  return /dualsense|dualshock|playstation|sony|054c/i.test(p.id||'') ? 'ps' : 'pad';
}
const keys=Object.create(null);
let prevBtn=[];
let started=false;

addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(!IS_XBOX&&!e.repeat) inputKind='key';
  if(!e.repeat){ recentKeys.unshift(e.code); recentKeys.length=Math.min(recentKeys.length,5); }
  onAnyInput();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if(quiz){
    if(e.code==='ArrowLeft')  moveQuiz(-1);
    if(e.code==='ArrowRight') moveQuiz(1);
    if(e.code==='Enter'||e.code==='Space') answerQuiz();
    if(e.code==='KeyR') repeatQuiz();
    if(e.code==='Escape'||e.code==='KeyO') closeQuiz();
    return;
  }
  if(settingsOpen){
    if(e.code==='ArrowUp')    moveSettings(-1);
    if(e.code==='ArrowDown')  moveSettings(1);
    if(e.code==='ArrowLeft')  cycleSetting(settingsRow,-1);
    if(e.code==='ArrowRight'||e.code==='Enter'||e.code==='Space') cycleSetting(settingsRow,1);
    if(e.code==='Escape'||e.code==='KeyO') toggleSettings(false);
    return;                            // nothing reaches the game while open
  }
  if(e.code==='Escape'||e.code==='KeyO') toggleSettings(true);
  if(e.code==='Space') doHorn();
  if(e.code==='KeyV') changeVehicle();
  if(/^Digit[1-5]$/.test(e.code)) setVehicle(+e.code.slice(5)-1,true);
  if(e.code==='KeyL') toggleLights();
  if(e.code==='KeyK') toggleSiren();   // K, not S -- S is 'drive down' in WASD
},{passive:false});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('pointerdown',onAnyInput);

function readKeys(){
  let x=0,y=0;
  if(keys.ArrowLeft ||keys.KeyA) x-=1;
  if(keys.ArrowRight||keys.KeyD) x+=1;
  if(keys.ArrowUp   ||keys.KeyW) y-=1;
  if(keys.ArrowDown ||keys.KeyS) y+=1;
  return {x,y};
}

function readPads(){
  const pads=navigator.getGamepads?navigator.getGamepads():[];
  let x=0,y=0,boost=0,rev=0;
  const pressed=[];
  for(const p of pads){
    if(!p) continue;
    let act=false;
    // either stick drives -- a small child grabs whichever is under their thumb,
    // and it also covers controllers that report the sticks on other axis pairs
    let sx=0,sy=0,best=0;
    for(const pair of [[0,1],[2,3]]){
      const vx=p.axes[pair[0]]||0, vy=p.axes[pair[1]]||0;
      const m=Math.hypot(vx,vy);
      if(m>DEADZONE&&m>best){ best=m; sx=vx; sy=vy; }
    }
    if(best>0){ x+=sx; y+=sy; act=true; }
    const b=p.buttons;
    const down=i=>b[i]&&(b[i].pressed||b[i].value>0.5);
    if(down(14)) x-=1;
    if(down(15)) x+=1;
    if(down(12)) y-=1;
    if(down(13)) y+=1;
    if(b[7]) boost=Math.max(boost,b[7].value||(b[7].pressed?1:0));
    if(b[6]) rev  =Math.max(rev,  b[6].value||(b[6].pressed?1:0));
    for(let i=0;i<b.length;i++) if(down(i)){ pressed[i]=true; act=true; }
    if(boost>0.2||rev>0.2) act=true;
    if(act&&!IS_XBOX) inputKind=padKind(p);   // hints follow the device in hand
    if(act&&IS_XBOX)  inputKind=padKind(p);
  }
  const hit=i=>pressed[i]&&!prevBtn[i];
  if(quiz){
    if(hit(14)) moveQuiz(-1);
    if(hit(15)) moveQuiz(1);
    if(hit(0)) answerQuiz();
    if(hit(3)) repeatQuiz();
    if(hit(1)||hit(8)||hit(9)) closeQuiz();
  }else if(settingsOpen){
    if(hit(12)) moveSettings(-1);
    if(hit(13)) moveSettings(1);
    if(hit(14)) cycleSetting(settingsRow,-1);
    if(hit(15)||hit(0)) cycleSetting(settingsRow,1);
    if(hit(1)||hit(8)||hit(9)) toggleSettings(false);
  }else{
    if(hit(0)) doHorn();
    if(hit(2)) changeVehicle();
    if(hit(3)) toggleLights();
    if(hit(4)||hit(5)) toggleSiren();
    if(hit(8)||hit(9)) toggleSettings(true);    // View / Menu
  }
  if(pressed.some(Boolean)||Math.hypot(x,y)>DEADZONE) onAnyInput();
  prevBtn=pressed;
  const k=readKeys();
  x+=k.x; y+=k.y;
  if(keys.ShiftLeft) boost=1;
  return {x:clamp(x,-1,1),y:clamp(y,-1,1),boost,rev};
}

function onAnyInput(){
  if(started){ audioResume(); return; }
  started=true;
  audioInit(); audioResume();
  document.getElementById('start').classList.add('gone');
  const el=document.documentElement;
  const fs=el.requestFullscreen||el.webkitRequestFullscreen;
  // fullscreen needs a trusted gesture; ignore rejection when it is not granted
  if(fs) try{ const p=fs.call(el); if(p && p.catch) p.catch(()=>{}); }catch(_){}
}

/* ========================= infinite world ==========================
   The town is an unbounded grid of cells, BLOCK units square, with roads
   running along every cell boundary. Each cell's contents are derived
   purely from its (i,j) coordinates, so the same place always generates
   the same way -- but there is no edge and it never repeats.
   Cells are built on demand around the truck and dropped when far away. */

const PROP={
  //                                 kick = how far it gets knocked
  //                                 drag = how much it slows the truck on impact
  cow:    {r:24,sfx:'moo',   kick:1.0, drag:0.86},
  chicken:{r:12,sfx:'cluck', kick:2.1, drag:0.97},
  duck:   {r:12,sfx:'quack', kick:1.9, drag:0.97},
  ball:   {r:17,sfx:'boing', kick:2.6, drag:0.95},
  cone:   {r:13,sfx:'bonk',  kick:1.7, drag:0.93},
  bin:    {r:18,sfx:'clang', kick:1.3, drag:0.90},
  tree:   {r:27,sfx:'rustle',kick:0,   drag:0.96},   // drive right through, it rustles
  bird:   {r:11,sfx:'chirp', kick:0,   drag:1.0},
};
const PROP_BURST={cow:'#ffffff',chicken:'#fff3c4',duck:'#ffe066',ball:'#ff8fa3',
  cone:'#ff9f43',bin:'#9fe0b0',tree:'#4e9c3f',bird:'#a8d8ff'};

const HOUSE=['#e8735e','#f0a94b','#69b8d8','#b489d4','#eec95a','#8ec96b','#e0857f','#7fb8a8'];

const CELLS=new Map();
let active=[];

function hash2(i,j){
  let h=Math.imul(i,374761393)+Math.imul(j,668265263);
  h=Math.imul(h^(h>>>13),1274126177);
  return (h^(h>>>16))>>>0;
}

function genCell(i,j){
  const R=mulberry32(hash2(i,j)|0);
  const f=(a,b)=>a+R()*(b-a);
  const pickR=a=>a[Math.floor(R()*a.length)];

  const cell={i,j,kind:'houses',buildings:[],props:[],patches:[],pond:null,
              lamp:{x:i*BLOCK+ROAD_W/2+14,y:j*BLOCK+ROAD_W/2+14}};

  const pad=ROAD_W/2+34;
  const x0=i*BLOCK+pad, x1=(i+1)*BLOCK-pad;
  const y0=j*BLOCK+pad, y1=(j+1)*BLOCK-pad;
  const iw=x1-x0, ih=y1-y0;

  const roll=R();
  if(roll<0.08)      cell.kind='pond';
  else if(roll<0.20) cell.kind='field';
  else if(roll<0.28) cell.kind='barn';
  else if(roll<0.36) cell.kind='park';

  // grass tone patches (drawn under the roads)
  for(let n=0;n<7;n++)
    cell.patches.push({x:f(i*BLOCK,(i+1)*BLOCK),y:f(j*BLOCK,(j+1)*BLOCK),
      r:f(38,110),c:R()<0.5?C.grass2:C.grass3});

  const add=(type,x,y)=>{
    cell.props.push({type,x,y,vx:0,vy:0,rot:R()*6.28,spin:0,
      react:0,cool:0,fly:0,r:PROP[type].r});
  };
  // is (x,y) clear of this cell's own buildings / pond?
  const free=(x,y,rad)=>{
    if(cell.pond&&Math.hypot(x-cell.pond.x,y-cell.pond.y)<cell.pond.r+rad+16) return false;
    for(const b of cell.buildings)
      if(x>b.x-rad-12&&x<b.x+b.w+rad+12&&y>b.y-rad-12&&y<b.y+b.h+rad+12) return false;
    return true;
  };
  const scatter=(type,count)=>{
    let placed=0,guard=0;
    while(placed<count&&guard<count*40){
      guard++;
      const x=f(x0,x1), y=f(y0,y1);
      if(!free(x,y,PROP[type].r)) continue;
      add(type,x,y); placed++;
    }
  };

  switch(cell.kind){
    case 'pond':{
      cell.pond={x:(x0+x1)/2,y:(y0+y1)/2,r:Math.min(iw,ih)/2-6};
      for(let n=0;n<5;n++){
        const a=R()*6.28, d=cell.pond.r+f(16,44);
        add('duck',cell.pond.x+Math.cos(a)*d,cell.pond.y+Math.sin(a)*d);
      }
      scatter('tree',3);
      break;
    }
    case 'field':
      scatter('cow',Math.round(f(4,8)));
      scatter('tree',2);
      break;
    case 'barn':{
      const w=Math.min(210,iw*0.7), h=Math.min(160,ih*0.58);
      cell.buildings.push({x:x0+(iw-w)/2,y:y0+(ih-h)/2,w,h,
        col:'#c9412f',roof:'#9c3123',kind:'barn',react:0,cool:0});
      scatter('chicken',Math.round(f(5,9)));
      scatter('tree',2);
      break;
    }
    case 'park':
      scatter('tree',Math.round(f(7,12)));
      scatter('ball',2);
      scatter('bird',3);
      break;
    default:{                                   // houses
      const cols=iw>300?2:1, rows=ih>300?2:1;
      for(let a=0;a<cols;a++) for(let b=0;b<rows;b++){
        if(cols*rows>1&&R()<0.22) continue;
        const sw=iw/cols, sh=ih/rows;
        const w=clamp(sw*f(0.5,0.76),70,190), h=clamp(sh*f(0.5,0.76),70,190);
        const col=pickR(HOUSE);
        cell.buildings.push({x:x0+a*sw+(sw-w)/2+f(-10,10),
                             y:y0+b*sh+(sh-h)/2+f(-10,10),
                             w,h,col,roof:shade(col,-0.24),kind:'house',react:0,cool:0});
      }
      scatter('bin',2); scatter('ball',1); scatter('tree',2); scatter('bird',1);
    }
  }

  // cones on this cell's west and north road segments
  const cones=Math.floor(f(0,3.2));
  for(let n=0;n<cones;n++){
    if(R()<0.5) add('cone', i*BLOCK+f(-ROAD_W*0.34,ROAD_W*0.34), f(j*BLOCK,(j+1)*BLOCK));
    else        add('cone', f(i*BLOCK,(i+1)*BLOCK), j*BLOCK+f(-ROAD_W*0.34,ROAD_W*0.34));
  }
  // a question stop, roughly every third or fourth block
  if(R()<0.28){
    let qx=0,qy=0,ok=false;
    for(let n=0;n<30&&!ok;n++){ qx=f(x0,x1); qy=f(y0,y1); ok=free(qx,qy,34); }
    if(ok) cell.props.push({type:'quiz',x:qx,y:qy,vx:0,vy:0,rot:0,spin:0,
      react:0,cool:0,fly:0,r:26,armed:true});
  }
  return cell;
}

function getCell(i,j){
  const k=i+','+j;
  let c=CELLS.get(k);
  if(!c){ c=genCell(i,j); CELLS.set(k,c); }
  return c;
}

function refreshCells(){
  const halfW=cw/2/scale, halfH=ch/2/scale, pad=BLOCK*0.7;
  const minX=Math.min(cam.x-halfW,truck.x)-pad, maxX=Math.max(cam.x+halfW,truck.x)+pad;
  const minY=Math.min(cam.y-halfH,truck.y)-pad, maxY=Math.max(cam.y+halfH,truck.y)+pad;
  const i0=Math.floor(minX/BLOCK), i1=Math.floor(maxX/BLOCK);
  const j0=Math.floor(minY/BLOCK), j1=Math.floor(maxY/BLOCK);
  active.length=0;
  for(let i=i0;i<=i1;i++) for(let j=j0;j<=j1;j++) active.push(getCell(i,j));
}

function evictCells(){
  if(CELLS.size<=(KEEP*2+1)*(KEEP*2+1)) return;
  const ci=Math.floor(truck.x/BLOCK), cj=Math.floor(truck.y/BLOCK);
  for(const [k,c] of CELLS)
    if(Math.abs(c.i-ci)>KEEP||Math.abs(c.j-cj)>KEEP) CELLS.delete(k);
}

/* ============================== truck ============================== */
const truck={x:BLOCK/2,y:0,a:0,v:0,lights:false,siren:false,sway:0};
const cam={x:truck.x,y:truck.y};
let night=0;                 // 0 day .. 1 night, follows truck.lights
let banner=0, bannerText='';
function showBanner(t){ bannerText=t; banner=1.6; }
const parts=[];

function doHorn(){
  if(!started) return;
  if(!playSample('horn')) SFX.horn();   // recorded horn, else synthesised
  truck.sway=1;
}
function toggleLights(){ if(!started) return; truck.lights=!truck.lights; SFX.click(); }
function toggleSiren(){
  if(!started) return;
  truck.siren=!truck.siren;
  if(truck.siren) sirenOn(); else sirenOff();
}

function burst(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=rnd()*6.28, s=rr(40,190);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rr(0.3,0.7),max:0.7,r:rr(3,8),col});
  }
}

/* ============================== update ============================== */
let evictTimer=0;

function pollInput(){
  const inp=readPads();
  IN.x=inp.x; IN.y=inp.y; IN.boost=inp.boost; IN.rev=inp.rev;
}

function update(dt){
  const maxv=MAXV*V.speed;

  if(driveMode==='turn'){
    // up/down drive, left/right steer. Steering works even at a standstill so
    // it can always be pointed at something without having to be moving first.
    const dz=v=>Math.abs(v)<0.2?0:v;
    const tx=dz(IN.x), ty=dz(IN.y);
    if(tx) truck.a+=tx*TURN*dt;
    if(ty){
      const fwd=ty<0;                              // stick/D-pad up = forwards
      truck.v+=-ty*ACCEL*V.speed*(fwd?(1+IN.boost*0.35):0.75)*dt;
    }
  }else{
    // push the stick the way you want to go and it turns to face there
    const mag=Math.min(1,Math.hypot(IN.x,IN.y));
    if(mag>DEADZONE){
      const target=Math.atan2(IN.y,IN.x);
      const d=angDiff(target,truck.a);
      const slow=1-clamp(Math.abs(truck.v)/maxv,0,1);
      const rate=2.5+slow*1.6;                     // easier to turn when nearly stopped
      truck.a+=clamp(d,-rate*dt,rate*dt);
      const align=Math.max(0,Math.cos(d));         // no sideways lurching
      truck.v+=mag*align*ACCEL*V.speed*(1+IN.boost*0.35)*dt;
    }
  }
  if(IN.rev>0.3) truck.v-=ACCEL*0.7*IN.rev*dt;     // LT reverses in either system

  truck.v*=Math.exp(-1.7*dt);
  truck.v=clamp(truck.v,-maxv*0.5,maxv*(1+IN.boost*0.22));
  truck.x+=Math.cos(truck.a)*truck.v*dt;
  truck.y+=Math.sin(truck.a)*truck.v*dt;
  truck.sway=Math.max(0,truck.sway-dt*3);

  for(const cell of active){
    // --- buildings do not block either. nothing in this world does.
    //     they just wobble and thunk as you drive through.
    for(const b of cell.buildings){
      if(b.cool>0)  b.cool-=dt;
      if(b.react>0) b.react-=dt;
      if(truck.x<b.x-V.r||truck.x>b.x+b.w+V.r||
         truck.y<b.y-V.r||truck.y>b.y+b.h+V.r) continue;
      if(b.cool<=0){
        b.cool=0.7; b.react=0.5;
        SFX.thunk();
        burst(truck.x,truck.y,b.col,8);
      }
    }
    // --- ponds slow you down with a splash, but you can drive through
    if(cell.pond){
      const p=cell.pond;
      if(Math.hypot(truck.x-p.x,truck.y-p.y)<p.r){
        truck.v*=Math.exp(-1.6*dt);
        if(rnd()<dt*7){ burst(truck.x,truck.y,'#bfeeff',2); if(rnd()<0.16) SFX.splash(); }
      }
    }
    // --- bumpable props: nothing here blocks the truck
    for(const p of cell.props){
      if(p.cool>0) p.cool-=dt;
      if(p.react>0) p.react-=dt;
      if(p.fly>0){ p.fly-=dt; if(p.fly<0) p.fly=0; }

      const dx=p.x-truck.x, dy=p.y-truck.y;
      const d=Math.hypot(dx,dy), reach=p.r+V.r;
      if(p.type==='quiz'){
        if(d<reach){ if(p.armed){ p.armed=false; openQuiz(); } }
        else if(d>reach+60) p.armed=true;   // re-arms once you have driven off it
        continue;
      }
      if(d<reach&&d>0.001&&p.cool<=0){
        const def=PROP[p.type];
        const push=(60+Math.abs(truck.v))*def.kick;
        p.vx+=dx/d*push; p.vy+=dy/d*push;
        p.spin+=rr(-9,9);
        truck.v*=def.drag;
        p.cool=0.45; p.react=0.65;
        SFX[def.sfx]();
        if(p.type==='bird') p.fly=2.0;
        burst(p.x,p.y,PROP_BURST[p.type],7);
      }

      if(p.vx||p.vy){
        p.x+=p.vx*dt; p.y+=p.vy*dt;
        p.vx*=Math.exp(-2.3*dt); p.vy*=Math.exp(-2.3*dt);
        if(Math.abs(p.vx)<1) p.vx=0;
        if(Math.abs(p.vy)<1) p.vy=0;
      }
      if(p.spin){ p.rot+=p.spin*dt; p.spin*=Math.exp(-2.2*dt); if(Math.abs(p.spin)<0.05) p.spin=0; }
    }
  }

  // --- particles
  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i];
    q.life-=dt;
    if(q.life<=0){ parts.splice(i,1); continue; }
    q.x+=q.vx*dt; q.y+=q.vy*dt;
    q.vx*=Math.exp(-3*dt); q.vy*=Math.exp(-3*dt);
  }

  // --- engine + camera + day/night
  if(A.engine){
    const fr=Math.abs(truck.v)/(MAXV*V.speed);
    A.engine.o.frequency.value=52+fr*94;
    A.engine.g.gain.value=0.028+fr*0.085;
    A.engine.f.frequency.value=320+fr*520;
  }
  night=lerp(night,truck.lights?1:0,1-Math.exp(-4*dt));
  const k=1-Math.exp(-6.5*dt);
  cam.x=lerp(cam.x,truck.x,k);
  cam.y=lerp(cam.y,truck.y,k);

  if(banner>0) banner-=dt;

  evictTimer-=dt;
  if(evictTimer<=0){ evictTimer=2; evictCells(); }
}

/* ============================== render ============================== */
const cv=document.getElementById('c'), g=cv.getContext('2d');
let cw=0,ch=0,scale=1;

function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  cw=innerWidth; ch=innerHeight;
  cv.width=Math.floor(cw*dpr); cv.height=Math.floor(ch*dpr);
  g.setTransform(dpr,0,0,dpr,0,0);
  scale=Math.max(ch/VIEW_H, cw/(VIEW_H*2.0));
}
addEventListener('resize',resize); resize();

function draw(){
  const halfW=cw/2/scale, halfH=ch/2/scale;
  const camX=cam.x, camY=cam.y;
  const L=camX-halfW-60, R=camX+halfW+60, T=camY-halfH-60, B=camY+halfH+60;
  const vis=(x,y,m)=>x>L-(m||0)&&x<R+(m||0)&&y>T-(m||0)&&y<B+(m||0);

  g.save();
  g.fillStyle=C.grass; g.fillRect(0,0,cw,ch);
  g.translate(cw/2,ch/2); g.scale(scale,scale); g.translate(-camX,-camY);

  for(const cell of active)
    for(const p of cell.patches){
      if(!vis(p.x,p.y,p.r)) continue;
      g.fillStyle=p.c; g.beginPath(); g.arc(p.x,p.y,p.r,0,6.2832); g.fill();
    }

  for(const cell of active){
    const p=cell.pond;
    if(!p||!vis(p.x,p.y,p.r)) continue;
    g.fillStyle=C.sand; g.beginPath(); g.arc(p.x,p.y,p.r+16,0,6.2832); g.fill();
    g.fillStyle=C.water; g.beginPath(); g.arc(p.x,p.y,p.r,0,6.2832); g.fill();
    g.strokeStyle='rgba(255,255,255,.35)'; g.lineWidth=4;
    g.beginPath(); g.arc(p.x,p.y,p.r*0.68,0.6,2.1); g.stroke();
  }

  // roads: every multiple of BLOCK that is on screen
  const kx0=Math.floor(L/BLOCK), kx1=Math.ceil(R/BLOCK);
  const ky0=Math.floor(T/BLOCK), ky1=Math.ceil(B/BLOCK);
  g.fillStyle=C.walk;
  for(let k=kx0;k<=kx1;k++) g.fillRect(k*BLOCK-ROAD_W/2-13,T,ROAD_W+26,B-T);
  for(let k=ky0;k<=ky1;k++) g.fillRect(L,k*BLOCK-ROAD_W/2-13,R-L,ROAD_W+26);
  g.fillStyle=C.road;
  for(let k=kx0;k<=kx1;k++) g.fillRect(k*BLOCK-ROAD_W/2,T,ROAD_W,B-T);
  for(let k=ky0;k<=ky1;k++) g.fillRect(L,k*BLOCK-ROAD_W/2,R-L,ROAD_W);
  g.strokeStyle=C.line; g.lineWidth=6; g.setLineDash([34,30]);
  g.beginPath();
  for(let k=kx0;k<=kx1;k++){ g.moveTo(k*BLOCK,T); g.lineTo(k*BLOCK,B); }
  for(let k=ky0;k<=ky1;k++){ g.moveTo(L,k*BLOCK); g.lineTo(R,k*BLOCK); }
  g.stroke(); g.setLineDash([]);
  g.fillStyle=C.road;
  for(let a=kx0;a<=kx1;a++) for(let b=ky0;b<=ky1;b++)
    g.fillRect(a*BLOCK-ROAD_W/2,b*BLOCK-ROAD_W/2,ROAD_W,ROAD_W);

  for(const cell of active)
    for(const b of cell.buildings){
      if(!vis(b.x+b.w/2,b.y+b.h/2,Math.max(b.w,b.h))) continue;
      const brc=b.react>0?b.react/0.5:0;
      g.save();
      if(brc>0){
        const s=1+Math.sin(brc*20)*brc*0.04, mx=b.x+b.w/2, my=b.y+b.h/2;
        g.translate(mx,my); g.scale(s,s); g.translate(-mx,-my);
      }
      g.fillStyle='rgba(0,0,0,.18)';
      roundRect(g,b.x+7,b.y+9,b.w,b.h,10); g.fill();
      g.fillStyle=b.col; roundRect(g,b.x,b.y,b.w,b.h,10); g.fill();
      g.fillStyle=b.roof;
      if(b.w>b.h) g.fillRect(b.x+6,b.y+b.h/2-5,b.w-12,10);
      else        g.fillRect(b.x+b.w/2-5,b.y+6,10,b.h-12);
      g.strokeStyle='rgba(0,0,0,.16)'; g.lineWidth=3;
      roundRect(g,b.x,b.y,b.w,b.h,10); g.stroke();
      if(b.kind==='barn'){
        g.fillStyle='#f4f1e6';
        g.fillRect(b.x+b.w*0.28,b.y+8,b.w*0.44,7);
        g.fillRect(b.x+b.w*0.28,b.y+b.h-15,b.w*0.44,7);
      }
      if(night>0.02){
        g.save(); g.globalAlpha=night*0.95; g.fillStyle='#ffdf7a';
        const cols=Math.max(1,Math.floor(b.w/46)), rows=Math.max(1,Math.floor(b.h/46));
        for(let a=0;a<cols;a++) for(let d=0;d<rows;d++){
          if(((a*7+d*13+Math.floor(b.x))%5)===0) continue;
          g.fillRect(b.x+10+a*(b.w-20)/cols,b.y+10+d*(b.h-20)/rows,11,11);
        }
        g.restore();
      }
      g.restore();
    }

  for(const cell of active)
    for(const p of cell.props) if(vis(p.x,p.y,60)) drawProp(p);

  for(const q of parts){
    g.globalAlpha=clamp(q.life/q.max,0,1);
    g.fillStyle=q.col;
    g.beginPath(); g.arc(q.x,q.y,q.r,0,6.2832); g.fill();
  }
  g.globalAlpha=1;

  drawVehicle();

  if(night>0.02){
    g.restore();
    g.fillStyle='rgba(12,22,58,'+(0.62*night).toFixed(3)+')';
    g.fillRect(0,0,cw,ch);
    g.save();
    g.translate(cw/2,ch/2); g.scale(scale,scale); g.translate(-camX,-camY);
    g.globalCompositeOperation='lighter';
    for(const cell of active){
      const l=cell.lamp;
      if(!vis(l.x,l.y,140)) continue;
      const rad=g.createRadialGradient(l.x,l.y,0,l.x,l.y,130);
      rad.addColorStop(0,'rgba(255,225,150,'+(0.55*night).toFixed(3)+')');
      rad.addColorStop(1,'rgba(255,225,150,0)');
      g.fillStyle=rad; g.beginPath(); g.arc(l.x,l.y,130,0,6.2832); g.fill();
    }
    for(const cell of active) for(const p of cell.props){
      if(p.type!=='quiz'||!vis(p.x,p.y,120)) continue;
      const q=g.createRadialGradient(p.x,p.y,0,p.x,p.y,110);
      q.addColorStop(0,'rgba(170,130,255,'+(0.6*night).toFixed(3)+')');
      q.addColorStop(1,'rgba(170,130,255,0)');
      g.fillStyle=q; g.beginPath(); g.arc(p.x,p.y,110,0,6.2832); g.fill();
    }
    drawBeams(night);
    g.globalCompositeOperation='source-over';
    for(const cell of active){
      const l=cell.lamp;
      if(!vis(l.x,l.y,40)) continue;
      g.fillStyle='#3c3f47'; g.beginPath(); g.arc(l.x,l.y,7,0,6.2832); g.fill();
      g.fillStyle='#ffe79a'; g.beginPath(); g.arc(l.x,l.y,4,0,6.2832); g.fill();
    }
  }
  g.restore();

  drawHUD();
  if(showInput) drawInputInfo();
  if(quiz) drawQuiz();
  if(settingsOpen) drawSettings();
}

function drawBeams(alpha){
  g.save();
  g.translate(truck.x,truck.y); g.rotate(truck.a);
  const len=430, spread=0.34;
  for(const off of [-V.hy,V.hy]){
    g.save(); g.translate(V.hx-1,off);
    const grd=g.createLinearGradient(0,0,len,0);
    grd.addColorStop(0,'rgba(255,244,205,'+(0.5*alpha).toFixed(3)+')');
    grd.addColorStop(0.55,'rgba(255,240,190,'+(0.2*alpha).toFixed(3)+')');
    grd.addColorStop(1,'rgba(255,238,180,0)');
    g.fillStyle=grd;
    g.beginPath(); g.moveTo(0,0);
    g.arc(0,0,len,-spread,spread); g.closePath(); g.fill();
    g.restore();
  }
  g.restore();
}

function drawProp(p){
  const rc=p.react>0?p.react/0.65:0;
  g.save();
  g.translate(p.x,p.y);
  if(p.type==='bird'&&p.fly>0){
    const t=1-p.fly/2.0, h=Math.sin(Math.min(1,t*1.4)*Math.PI)*46;
    g.globalAlpha=clamp(1-t*0.55,0.25,1);
    g.translate(0,-h); g.scale(1+h/90,1+h/90);
  }
  if(p.type!=='quiz'){
    g.fillStyle='rgba(0,0,0,.16)';
    g.beginPath(); g.ellipse(3,4,p.r*0.95,p.r*0.8,0,0,6.2832); g.fill();
  }
  g.rotate(p.rot);
  const pop=1+rc*0.22;
  g.scale(pop,pop);
  propArt(p.type,rc,p);
  g.restore();
}

// the artwork alone, centred on the origin, so the quiz can draw it too
function propArt(type,rc,p){
  switch(type){
    case 'cow':
      g.fillStyle='#fbfbf7'; g.beginPath(); g.ellipse(0,0,24,17,0,0,6.2832); g.fill();
      g.fillStyle='#33302e';
      g.beginPath(); g.ellipse(-8,-5,8,6,0.4,0,6.2832); g.fill();
      g.beginPath(); g.ellipse(7,6,6.5,5,-0.3,0,6.2832); g.fill();
      g.fillStyle='#fbfbf7'; g.beginPath(); g.arc(20,0,9,0,6.2832); g.fill();
      g.fillStyle='#f3b2b8'; g.beginPath(); g.arc(24,0,4.5,0,6.2832); g.fill();
      g.fillStyle='#33302e';
      g.beginPath(); g.arc(19,-7,2.4,0,6.2832); g.fill();
      g.beginPath(); g.arc(19,7,2.4,0,6.2832); g.fill();
      break;
    case 'chicken':
      g.fillStyle='#fffdf5'; g.beginPath(); g.ellipse(0,0,12,10,0,0,6.2832); g.fill();
      g.beginPath(); g.arc(9,-2,6.5,0,6.2832); g.fill();
      g.fillStyle='#e2453a'; g.beginPath(); g.arc(9,-8,3.2,0,6.2832); g.fill();
      g.fillStyle='#f5a623'; g.beginPath();
      g.moveTo(14,-2); g.lineTo(20,0); g.lineTo(14,2); g.closePath(); g.fill();
      g.fillStyle='#2c2a28'; g.beginPath(); g.arc(11,-3.5,1.7,0,6.2832); g.fill();
      break;
    case 'duck':
      g.fillStyle='#ffe14d'; g.beginPath(); g.ellipse(0,0,12,10,0,0,6.2832); g.fill();
      g.beginPath(); g.arc(9,-2,6.5,0,6.2832); g.fill();
      g.fillStyle='#f58a1f'; g.beginPath();
      g.moveTo(14,-2.5); g.lineTo(21,0); g.lineTo(14,2.5); g.closePath(); g.fill();
      g.fillStyle='#2c2a28'; g.beginPath(); g.arc(11,-3.5,1.7,0,6.2832); g.fill();
      break;
    case 'ball':
      g.fillStyle='#ff5d73'; g.beginPath(); g.arc(0,0,17,0,6.2832); g.fill();
      g.fillStyle='#fff8f0'; g.beginPath(); g.ellipse(0,0,17,6,0,0,6.2832); g.fill();
      g.fillStyle='#3aa6e0'; g.beginPath(); g.arc(0,0,5,0,6.2832); g.fill();
      break;
    case 'cone':
      g.fillStyle='#3f3f44'; g.beginPath(); g.ellipse(0,0,14,14,0,0,6.2832); g.fill();
      g.fillStyle='#ff8a1f'; g.beginPath(); g.arc(0,0,11,0,6.2832); g.fill();
      g.fillStyle='#fff6e8'; g.beginPath(); g.arc(0,0,7,0,6.2832); g.fill();
      g.fillStyle='#ff8a1f'; g.beginPath(); g.arc(0,0,3.5,0,6.2832); g.fill();
      break;
    case 'bin':
      g.fillStyle='#3f7a4e'; g.beginPath(); g.arc(0,0,18,0,6.2832); g.fill();
      g.fillStyle='#579a63'; g.beginPath(); g.arc(0,0,14,0,6.2832); g.fill();
      g.strokeStyle='#3f7a4e'; g.lineWidth=3;
      g.beginPath(); g.moveTo(-10,0); g.lineTo(10,0); g.stroke();
      break;
    case 'tree':{
      const s=1+Math.sin(rc*22)*rc*0.11;
      g.scale(s,s);
      g.fillStyle='#3f7f33'; g.beginPath(); g.arc(0,0,27,0,6.2832); g.fill();
      g.fillStyle='#4b9440';
      g.beginPath(); g.arc(-9,-8,15,0,6.2832); g.fill();

      g.fillStyle='#7a5230'; g.beginPath(); g.arc(0,0,5,0,6.2832); g.fill();
      break;
    }
    case 'bird':{
      g.fillStyle='#5aa9e6'; g.beginPath(); g.ellipse(0,0,10,8,0,0,6.2832); g.fill();
      g.fillStyle='#8fcbf5';
      const w=(p&&p.fly>0)?Math.sin(p.fly*26)*7:2;
      g.beginPath(); g.ellipse(-1,-8,8,3+Math.abs(w)*0.5,0.2,0,6.2832); g.fill();
      g.beginPath(); g.ellipse(-1,8,8,3+Math.abs(w)*0.5,-0.2,0,6.2832); g.fill();
      g.fillStyle='#f5a623'; g.beginPath();
      g.moveTo(9,-1.5); g.lineTo(15,0); g.lineTo(9,1.5); g.closePath(); g.fill();
      break;
    }
    case 'quiz':{
      const t=performance.now()/560, s=1+Math.sin(t)*0.07;
      g.scale(s,s);
      g.fillStyle='rgba(0,0,0,.16)';
      g.beginPath(); g.ellipse(3,5,24,20,0,0,6.2832); g.fill();
      g.fillStyle='#7c4ddb'; g.beginPath(); g.arc(0,0,25,0,6.2832); g.fill();
      g.fillStyle='#a78bfa'; g.beginPath(); g.arc(0,0,19,0,6.2832); g.fill();
      g.fillStyle='#fff';
      g.font='800 28px system-ui,sans-serif';
      g.textAlign='center'; g.textBaseline='middle';
      g.fillText('?',0,2);
      g.textAlign='left'; g.textBaseline='alphabetic';
      break;
    }
  }
}

/* ============================ vehicles ============================
   Each vehicle faces +X in its own local space. `draw` renders the body
   only -- shadow, headlights and the siren bar are drawn around it by
   drawVehicle() so every vehicle gets them in the right place. */

function wheels(g,xs,yo,w,h){
  g.fillStyle='#26282e';
  for(const x of xs){
    roundRect(g,x,-yo-h,w,h,3); g.fill();
    roundRect(g,x, yo,   w,h,3); g.fill();
  }
}

/* ------------------------------ HUD ------------------------------ */
/* Button hints match whatever is being used. Chrome only reveals gamepads
   after a button press, so this starts on keyboard and flips the instant a
   controller is touched -- which on the Xbox is before the HUD is ever seen. */
const HINTS={
  pad:{ horn :{c:'#4caf50',t:'A'},        veh  :{c:'#2e6fd9',t:'X'},
        light:{c:'#f0c419',t:'Y'},        siren:{c:'#6b7280',t:'LB'} },
  ps :{ horn :{c:'#7b6ce0',shape:'cross'},veh  :{c:'#e06aa8',shape:'square'},
        light:{c:'#3fb87a',shape:'tri'},  siren:{c:'#6b7280',t:'L1'} },
  key:{ horn :{c:'#41464e',t:'SPACE',key:1}, veh  :{c:'#41464e',t:'V',key:1},
        light:{c:'#41464e',t:'L',key:1},     siren:{c:'#41464e',t:'K',key:1} },
};

// PlayStation face buttons, drawn rather than typed so no font can drop them
function psShape(kind,r){
  const s=r*0.5;
  g.lineWidth=Math.max(2,r*0.2); g.strokeStyle='#fff'; g.lineJoin='round';
  g.beginPath();
  if(kind==='cross'){ g.moveTo(-s,-s); g.lineTo(s,s); g.moveTo(s,-s); g.lineTo(-s,s); }
  else if(kind==='square'){ g.rect(-s,-s,s*2,s*2); }
  else { g.moveTo(0,-s*1.15); g.lineTo(s,s*0.7); g.lineTo(-s,s*0.7); g.closePath(); }
  g.stroke();
}

// width of the glyph badge for one hint, at radius r
function glyphW(it,r){
  g.font='700 '+Math.round(r*0.95)+'px system-ui,sans-serif';
  return it.key ? Math.max(r*2, g.measureText(it.t).width+r*1.2) : r*2;
}

function drawGlyph(x,y,r,it){
  const w=glyphW(it,r), rad=it.key?r*0.42:r;
  g.fillStyle='rgba(0,0,0,.30)'; roundRect(g,x+2,y-r+2,w,r*2,rad); g.fill();
  g.fillStyle=it.c;              roundRect(g,x,  y-r,  w,r*2,rad); g.fill();
  if(it.shape){ g.save(); g.translate(x+w/2,y); psShape(it.shape,r); g.restore(); }
  else{
    g.fillStyle='#fff';
    g.font='700 '+Math.round(r*(it.key?0.95:1.05))+'px system-ui,sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText(it.t,x+w/2,y+1);
  }
  return w;
}

function drawHUD(){
  const inset=Math.min(cw,ch)*0.055;        // TV overscan safe area
  const H=HINTS[inputKind]||HINTS.pad;
  const items=[
    [H.horn,  'HONK'],
    [H.veh,   V.name],
    [H.light, truck.lights?'LIGHTS ON':'LIGHTS'],
    [H.siren, truck.siren?'SIREN ON':'SIREN'],
  ];
  let r=Math.max(12,Math.min(cw,ch)*0.020);

  // measure, and shrink if this device's labels are too wide for the screen
  const rowW=rr=>{
    let t=0;
    for(let i=0;i<items.length;i++){
      t+=glyphW(items[i][0],rr)+rr*0.45;
      g.font='700 '+Math.round(rr)+'px system-ui,sans-serif';
      t+=g.measureText(items[i][1]).width+rr*1.25;
    }
    return t;
  };
  const avail=cw-inset*2, total=rowW(r);
  if(total>avail) r=Math.max(8,r*avail/total);

  let x=inset, y=ch-inset-r;
  for(let i=0;i<items.length;i++){
    x+=drawGlyph(x,y,r,items[i][0])+r*0.45;
    g.font='700 '+Math.round(r)+'px system-ui,sans-serif';
    g.textAlign='left'; g.textBaseline='middle';
    g.fillStyle='rgba(255,255,255,.94)';
    g.strokeStyle='rgba(0,0,0,.45)'; g.lineWidth=Math.max(2,r*0.22);
    g.strokeText(items[i][1],x,y+1); g.fillText(items[i][1],x,y+1);
    x+=g.measureText(items[i][1]).width+r*1.25;
  }

  if(banner>0){
    g.globalAlpha=clamp(banner/0.5,0,1);
    const size=Math.max(26,Math.min(cw,ch)*0.075);
    g.font='800 '+Math.round(size)+'px system-ui,sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.lineWidth=size*0.2; g.strokeStyle='rgba(0,0,0,.5)';
    g.strokeText(bannerText,cw/2,Math.min(cw,ch)*0.15);
    g.fillStyle='#fff';
    g.fillText(bannerText,cw/2,Math.min(cw,ch)*0.15);
    g.globalAlpha=1;
  }
  g.textAlign='left'; g.textBaseline='alphabetic';
}

   Question stops are the purple "?" pads dotted around the town. Driving
   onto one asks about something the child already knows by sight from the
   world itself, so it works before they can read. Two shapes of question:

    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.rate=0.85; u.pitch=1.2;
    speechSynthesis.speak(u);
  }catch(_){}
}

const QUIZ_LETTERS='ABCDEFGHIJKLMNOPRSTUW';
const QUIZ_FOOT={
  pad:'D-PAD  CHOOSE       A  PICK       Y  SAY AGAIN       B  DRIVE ON',
  ps :'D-PAD  CHOOSE       X  PICK       \u25b3  SAY AGAIN       O  DRIVE ON',

/* Difficulty ladder. Rung 1 is two choices, short words, and distractor
   letters whose *names* do not rhyme with the answer -- B/C/D/E/G/P/T all
   sound alike said aloud, which matters when the child is matching by ear.
   Later rungs add a third choice, longer words, then the harder direction. */
const LEVELS=[
  {choices:2, maxLen:4,  mixed:false, distinct:true },
  {choices:3, maxLen:4,  mixed:false, distinct:true },
  {choices:3, maxLen:5,  mixed:false, distinct:false},
  {choices:3, maxLen:99, mixed:false, distinct:false},
  {choices:3, maxLen:99, mixed:true,  distinct:false},
];
const UP_AFTER=4;      // consecutive first-try correct answers to move up
const DOWN_AFTER=3;    // wrong answers at a rung before easing back down

const LETTER_GROUP={};
'BCDEGPTVZ'.split('').forEach(c=>LETTER_GROUP[c]='ee');
'AHJK'.split('').forEach(c=>LETTER_GROUP[c]='ay');
'FLMNSX'.split('').forEach(c=>LETTER_GROUP[c]='eh');

let quizMode='auto';   // 'auto' grows with them | 'easy' locked low | 'hard' locked high
let quizLevel=0, quizStreak=0, quizMiss=0;
try{
  const m=localStorage.getItem('roundtown.quiz');
  if(m==='auto'||m==='easy'||m==='hard') quizMode=m;
  quizLevel=clamp(parseInt(localStorage.getItem('roundtown.level'),10)||0,0,LEVELS.length-1);
}catch(_){}
function saveProgress(){
  try{ localStorage.setItem('roundtown.level',String(quizLevel)); }catch(_){}
}
function levelNow(){
  return quizMode==='easy' ? 0
       : quizMode==='hard' ? LEVELS.length-1
       : quizLevel;
}

let quiz=null;
const conf=[];
const rpick=a=>a[Math.floor(rnd()*a.length)];

function buildChoices(mode,item,lv){
  const L=item.w[0], want=lv.choices-1;
  const others=[];
  const okLetter=c=>c!==L&&others.indexOf(c)<0&&
                    !(lv.distinct&&LETTER_GROUP[c]&&LETTER_GROUP[c]===LETTER_GROUP[L]);
  if(mode==='letter'){
    for(let n=0;n<400&&others.length<want;n++){
      const c=rpick(QUIZ_LETTERS); if(okLetter(c)) others.push(c);
    }
    for(let n=0;n<400&&others.length<want;n++){        // relax if that starved
      const c=rpick(QUIZ_LETTERS);
      if(c!==L&&others.indexOf(c)<0) others.push(c);
    }
    return [{letter:L,correct:true}].concat(others.map(c=>({letter:c})));
  }
  const pool=QUIZ_ITEMS.filter(i=>i.w.length<=lv.maxLen);
  const taken=[];
  const okItem=it=>it.w[0]!==L&&taken.indexOf(it.w[0])<0&&
                   !(lv.distinct&&LETTER_GROUP[it.w[0]]&&
                     LETTER_GROUP[it.w[0]]===LETTER_GROUP[L]);
  const picks=[];
  for(let n=0;n<400&&picks.length<want;n++){
    const it=rpick(pool.length?pool:QUIZ_ITEMS);
    if(okItem(it)){ picks.push(it); taken.push(it.w[0]); }
  }
  for(let n=0;n<400&&picks.length<want;n++){
    const it=rpick(QUIZ_ITEMS);
    if(it.w[0]!==L&&taken.indexOf(it.w[0])<0){ picks.push(it); taken.push(it.w[0]); }
  }
  return [{item,correct:true}].concat(picks.map(it=>({item:it})));
}

function openQuiz(){
  if(quiz||settingsOpen) return;
  const lv=LEVELS[levelNow()];
  const mode=(lv.mixed&&rnd()<0.5)?'picture':'letter';
  const pool=QUIZ_ITEMS.filter(i=>i.w.length<=lv.maxLen);
  const item=rpick(pool.length?pool:QUIZ_ITEMS), L=item.w[0];
  const choices=buildChoices(mode,item,lv);
  for(let i=choices.length-1;i>0;i--){
    const j=Math.floor(rnd()*(i+1));
    const t=choices[i]; choices[i]=choices[j]; choices[j]=t;
  }
  quiz={mode,item,letter:L,choices,sel:0,done:false,doneT:0,shake:0,wrong:-1,missed:false};
  conf.length=0;
  SFX.click();
  say(mode==='letter' ? 'What does '+item.w.toLowerCase()+' start with?'
                      : 'Which one starts with the letter '+L+'?');
}

function closeQuiz(){ quiz=null; conf.length=0; }
function repeatQuiz(){
  if(!quiz||quiz.done) return;
  say(quiz.mode==='letter'
    ? 'What does '+quiz.item.w.toLowerCase()+' start with?'
    : 'Which one starts with the letter '+quiz.letter+'?');
}
function moveQuiz(d){
  if(!quiz||quiz.done) return;
  quiz.sel=(quiz.sel+d+quiz.choices.length)%quiz.choices.length;
  SFX.click();
  // say each option as it is landed on, so the letter shapes do not have to
  // be known yet -- the child can match by sound instead
  const c=quiz.choices[quiz.sel];
  say(quiz.mode==='letter' ? c.letter : c.item.w.toLowerCase());
}
function answerQuiz(){
  if(!quiz||quiz.done) return;
  const c=quiz.choices[quiz.sel];
  if(c.correct){
    quiz.done=true; quiz.doneT=2.6; quiz.wrong=-1;
    SFX.yay(); confetti();
    const word=quiz.mode==='letter'?quiz.item.w:c.item.w;
    say('Yes! '+word.toLowerCase()+' starts with '+quiz.letter);
    // only a first-try answer counts towards moving up
    if(quizMode==='auto'&&!quiz.missed){
      quizStreak++; quizMiss=0;
      if(quizStreak>=UP_AFTER&&quizLevel<LEVELS.length-1){ quizLevel++; quizStreak=0; }
      saveProgress();
    }
  }else{
    quiz.shake=0.5; quiz.wrong=quiz.sel; quiz.missed=true;
    SFX.nope(); say('Try again');
    if(quizMode==='auto'){
      quizStreak=0; quizMiss++;
      if(quizMiss>=DOWN_AFTER&&quizLevel>0){ quizLevel--; quizMiss=0; }
      saveProgress();
    }
  }
}
function confetti(){
  const cols=['#ff5d73','#ffd166','#4ecdc4','#8b5cf6','#6cc24a','#ff8a1f'];
  for(let i=0;i<80;i++) conf.push({
    x:cw/2+rr(-cw*0.16,cw*0.16), y:ch*0.42,
    vx:rr(-300,300), vy:rr(-620,-160), r:rr(5,11),
    c:rpick(cols), rot:rr(0,6.28), spin:rr(-9,9), life:rr(1.3,2.4), max:2.4});
}
function tickQuiz(dt){
  if(quiz&&quiz.shake>0) quiz.shake=Math.max(0,quiz.shake-dt);
  for(let i=conf.length-1;i>=0;i--){
    const p=conf[i];
    p.life-=dt;
    if(p.life<=0){ conf.splice(i,1); continue; }
    p.vy+=950*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.spin*dt;
  }
  if(quiz&&quiz.done){ quiz.doneT-=dt; if(quiz.doneT<=0) closeQuiz(); }
}

function drawQuiz(){
  const u=Math.min(cw,ch);
  g.fillStyle='rgba(8,16,38,.84)'; g.fillRect(0,0,cw,ch);
  const w=Math.min(cw*0.9,940), h=Math.min(ch*0.9,u*1.05);
  const x=(cw-w)/2, y=(ch-h)/2;
  g.fillStyle='#fffdf7'; roundRect(g,x,y,w,h,u*0.04); g.fill();

  g.textBaseline='middle';
  const qy=y+h*0.10;
  if(quiz.mode==='letter'){
    // "WHAT DOES TREE START WITH?" with the word picked out, shrunk to fit
    const pre='WHAT DOES ', word=quiz.item.w, post=' START WITH?';
    let fs=h*0.058;
    const setF=()=>g.font='800 '+Math.round(fs)+'px system-ui,sans-serif';
    setF();
    let total=g.measureText(pre+word+post).width;
    const maxW=w*0.88;
    if(total>maxW){ fs*=maxW/total; setF(); total=g.measureText(pre+word+post).width; }
    g.textAlign='left';
    let tx=cw/2-total/2;
    g.fillStyle='#43506b'; g.fillText(pre,tx,qy);  tx+=g.measureText(pre).width;
    g.fillStyle='#7c4ddb'; g.fillText(word,tx,qy); tx+=g.measureText(word).width;
    g.fillStyle='#43506b'; g.fillText(post,tx,qy);
  }else{
    g.textAlign='center';
    g.fillStyle='#43506b';
    g.font='800 '+Math.round(h*0.058)+'px system-ui,sans-serif';
    g.fillText('WHICH ONE STARTS WITH', cw/2, qy);
  }
  g.textAlign='center';

  g.save();
  g.translate(cw/2, y+h*0.38);
  if(quiz.mode==='letter'){
    const k=(h*0.19)/30*quiz.item.s;
    g.save(); g.scale(k,k); quiz.item.art(); g.restore();
  }else{
    g.fillStyle='#7c4ddb';
    g.font='800 '+Math.round(h*0.26)+'px system-ui,sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText(quiz.letter,0,0);
  }
  g.restore();

  const n=quiz.choices.length, gap=w*0.045;
  const cardW=Math.min(w*0.3,(w*0.9-gap*(n-1))/n), cardH=h*0.235;
  const total=cardW*n+gap*(n-1), sx=x+(w-total)/2, cy=y+h*0.74;
  quiz.choices.forEach((c,i)=>{
    const sel=i===quiz.sel, good=quiz.done&&c.correct;
    const bad=quiz.wrong===i&&quiz.shake>0;
    const ox=bad?Math.sin(quiz.shake*52)*9:0;
    g.save();
    g.translate(sx+i*(cardW+gap)+cardW/2+ox, cy);
    g.scale(sel?1.06:1, sel?1.06:1);
    g.fillStyle=good?'#d7f5dc':(bad?'#fbdadd':'#eef2f8');
    roundRect(g,-cardW/2,-cardH/2,cardW,cardH,u*0.028); g.fill();
    g.strokeStyle=good?'#3aa757':(sel?'#1d64c4':'#d6dce5');
    g.lineWidth=(sel||good)?u*0.009:u*0.004;
    roundRect(g,-cardW/2,-cardH/2,cardW,cardH,u*0.028); g.stroke();
    if(quiz.mode==='letter'){
      g.fillStyle=good?'#2c8a48':'#33405a';
      g.font='800 '+Math.round(cardH*0.58)+'px system-ui,sans-serif';
      g.textAlign='center'; g.textBaseline='middle';
      g.fillText(c.letter,0,2);
    }else{
      const k=(cardH*0.3)/30*c.item.s;
      g.save(); g.scale(k,k); c.item.art(); g.restore();
    }
    g.restore();
  });

  for(const p of conf){
    g.save();
    g.globalAlpha=clamp(p.life/p.max,0,1);
    g.translate(p.x,p.y); g.rotate(p.rot);
    g.fillStyle=p.c; g.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.7);
    g.restore();
  }
  g.globalAlpha=1;

  g.fillStyle='#9aa4b3';
  g.font='700 '+Math.round(u*0.026)+'px system-ui,sans-serif';
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText(QUIZ_FOOT[inputKind]||QUIZ_FOOT.pad, cw/2, y+h-u*0.05);
  g.textAlign='left'; g.textBaseline='alphabetic';
}

/* A readout of what the page is actually receiving from the controller.
   Turned on from settings. Exists because console browsers vary in what
   they pass through to a page, and guessing from a description is slow. */
let showInput=false;
try{ if(localStorage.getItem('roundtown.diag')==='on') showInput=true; }catch(_){}

function drawInputInfo(){
  const u=Math.min(cw,ch), pad=u*0.055;
  const fs=Math.max(11,u*0.022), lh=fs*1.45;
  const pads=navigator.getGamepads?[...navigator.getGamepads()].filter(Boolean):[];
  const lines=[];
  lines.push('user agent xbox: '+(IS_XBOX?'yes':'no')+'    hints: '+inputKind);
  lines.push('gamepads seen: '+pads.length);
  pads.forEach((p,i)=>{
    lines.push(' ['+i+'] '+String(p.id||'?').slice(0,44));
    lines.push('     mapping: '+(p.mapping||'(none)')+'   axes: '+p.axes.length+
               '   buttons: '+p.buttons.length);
    const ax=[...p.axes].map((v,n)=>n+':'+v.toFixed(2)).join('  ');
    lines.push('     '+(ax||'(no axes)'));
    const dn=[];
    p.buttons.forEach((b,n)=>{ if(b.pressed||b.value>0.5) dn.push(n); });
    lines.push('     pressed: '+(dn.length?dn.join(' '):'-'));
  });
  if(!pads.length) lines.push(' (nothing from the Gamepad API)');
  lines.push('recent keys: '+(recentKeys.length?recentKeys.join(' '):'-'));
  lines.push('drive x/y: '+IN.x.toFixed(2)+' / '+IN.y.toFixed(2));

  g.font='600 '+Math.round(fs)+'px ui-monospace,Menlo,Consolas,monospace';
  g.textAlign='left'; g.textBaseline='top';
  let wide=0;
  for(const l of lines) wide=Math.max(wide,g.measureText(l).width);
  const bw=wide+fs*1.6, bh=lines.length*lh+fs*1.2;
  g.fillStyle='rgba(8,14,30,.82)';
  roundRect(g,pad,pad,bw,bh,fs*0.6); g.fill();
  g.fillStyle='#bfe6ff';
  lines.forEach((l,i)=>g.fillText(l,pad+fs*0.8,pad+fs*0.6+i*lh));
  g.textBaseline='alphabetic';
}

/* ============================ settings ============================
   For the grown-up, not the child: opened with View/Menu on a controller or
   Esc on a keyboard, and it pauses the world while it is up. Add a row here
   and it appears on screen with no other changes needed. */
const SETTINGS=[
  {
    id:'drive', label:'DRIVING',
    options:[
      {v:'turn',  name:'THRUST & STEER', hint:'Up and down drive. Left and right steer.'},
      {v:'point', name:'POINT & GO',     hint:'Push the stick the way you want to go.'},
    ],
    get:()=>driveMode,
    set:v=>{ driveMode=v; try{ localStorage.setItem('roundtown.drive',v); }catch(_){} },
  },
  {
    id:'quiz', label:'QUESTIONS',
    options:[
      {v:'auto', name:'GROWS WITH THEM',
       hint:()=>'Short words and two answers to start. On step '+
                (quizLevel+1)+' of '+LEVELS.length+'.'},
      {v:'easy', name:'ALWAYS EASIEST',
       hint:'Two answers, short words, letters that sound different.'},
      {v:'hard', name:'ALWAYS HARDEST',
       hint:'Every word, three answers, both question directions.'},
    ],
    get:()=>quizMode,
    set:v=>{ quizMode=v; try{ localStorage.setItem('roundtown.quiz',v); }catch(_){} },
  },
  {
    id:'diag', label:'CONTROLLER INFO',
    options:[
      {v:'off', name:'HIDDEN',  hint:'Normal play.'},
      {v:'on',  name:'SHOWING', hint:'Shows what the controller is sending. For troubleshooting.'},
    ],
    get:()=>showInput?'on':'off',
    set:v=>{ showInput=(v==='on'); try{ localStorage.setItem('roundtown.diag',v); }catch(_){} },
  },
  {
    id:'voice', label:'TALKING',
    options:[
      {v:'on',  name:'ON',  hint:'Reads the letter questions out loud.'},
      {v:'off', name:'OFF', hint:'Questions are shown but not spoken.'},
    ],
    get:()=>voiceOn?'on':'off',
    set:v=>{ voiceOn=(v==='on');
             try{ localStorage.setItem('roundtown.voice',v); }catch(_){}
             if(!voiceOn&&window.speechSynthesis) try{ speechSynthesis.cancel(); }catch(_){} },
  },
];

const SETTINGS_FOOT={
  pad:'D-PAD  CHOOSE          A  CHANGE          B  CLOSE',
  ps :'D-PAD  CHOOSE          X  CHANGE          O  CLOSE',
  key:'ARROWS  CHOOSE          ENTER  CHANGE          ESC  CLOSE',
};

function toggleSettings(open){
  const want = open===undefined ? !settingsOpen : open;
  if(want===settingsOpen) return;
  settingsOpen=want;
  if(settingsOpen) settingsRow=0;
  if(started) SFX.click();
}
function moveSettings(d){
  settingsRow=(settingsRow+d+SETTINGS.length)%SETTINGS.length;
  SFX.click();
}
function cycleSetting(i,dir){
  const s=SETTINGS[i]; if(!s) return;
  const cur=Math.max(0,s.options.findIndex(o=>o.v===s.get()));
  s.set(s.options[(cur+dir+s.options.length)%s.options.length].v);
  SFX.click();
}

function drawSettings(){
  const u=Math.min(cw,ch);
  g.fillStyle='rgba(8,16,38,.80)'; g.fillRect(0,0,cw,ch);

  const w=Math.min(cw*0.82,760), rowH=u*0.135;
  const h=Math.min(ch*0.8, u*0.22+SETTINGS.length*rowH+u*0.14);
  const x=(cw-w)/2, y=(ch-h)/2;
  g.fillStyle='#f7f5ef'; roundRect(g,x,y,w,h,u*0.035); g.fill();

  g.textAlign='left'; g.textBaseline='middle';
  g.fillStyle='#2b3b52';
  g.font='800 '+Math.round(u*0.055)+'px system-ui,sans-serif';
  g.fillText('SETTINGS', x+u*0.06, y+u*0.075);

  SETTINGS.forEach((s,i)=>{
    const ry=y+u*0.145+i*rowH+rowH/2;
    const sel=i===settingsRow;
    if(sel){
      g.fillStyle='#dfe9f5';
      roundRect(g,x+u*0.035,ry-rowH*0.44,w-u*0.07,rowH*0.88,u*0.018); g.fill();
    }
    const opt=s.options.find(o=>o.v===s.get())||s.options[0];
    g.fillStyle='#5b6b80';
    g.font='700 '+Math.round(u*0.032)+'px system-ui,sans-serif';
    g.fillText(s.label, x+u*0.06, ry-rowH*0.30);
    g.fillStyle='#1d64c4';
    g.font='800 '+Math.round(u*0.042)+'px system-ui,sans-serif';
    g.fillText(opt.name, x+u*0.06, ry+rowH*0.01);
    // arrows showing the value can be changed
    g.fillStyle=sel?'#1d64c4':'#b9c3d1';
    g.font='800 '+Math.round(u*0.042)+'px system-ui,sans-serif';
    g.textAlign='right';
    g.fillText('\u2039  \u203a', x+w-u*0.06, ry);
    g.textAlign='left';
    if(sel){
      g.fillStyle='#7a8798';
      g.font='500 '+Math.round(u*0.026)+'px system-ui,sans-serif';
      const ht=typeof opt.hint==='function'?opt.hint():opt.hint;
      let hf=u*0.026;
      const room=w-u*0.12;
      g.font='500 '+Math.round(hf)+'px system-ui,sans-serif';
      const hw=g.measureText(ht).width;
      if(hw>room){
        hf*=room/hw;
        g.font='500 '+Math.round(hf)+'px system-ui,sans-serif';
      }
      g.fillText(ht, x+u*0.06, ry+rowH*0.34);
    }
  });

  g.fillStyle='#8b96a5';
  g.font='700 '+Math.round(u*0.026)+'px system-ui,sans-serif';
  g.textAlign='center';
  g.fillText(SETTINGS_FOOT[inputKind]||SETTINGS_FOOT.pad, cw/2, y+h-u*0.055);
  g.textAlign='left'; g.textBaseline='alphabetic';
}

/* ============================== loop ============================== */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);
  last=now;
  refreshCells();
  pollInput();                               // also on the start screen and in menus
  if(quiz) tickQuiz(dt);
  if(started&&!settingsOpen&&!quiz) update(dt);   // menus pause the world
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener('gamepadconnected',onAnyInput);

/* ---- whichever vehicle you last chose, on the start screen ---- */
(function(){
  const k=document.getElementById('tk'), q=k.getContext('2d');
  q.translate(180,100); q.scale(2.2,2.2); q.rotate(-Math.PI/2);
  q.fillStyle='rgba(0,0,0,.2)';
  roundRect(q,-V.len/2+2,-V.wid/2+2,V.len,V.wid,9); q.fill();
  V.draw(q);
  q.fillStyle='#ffe9a8';
  q.beginPath(); q.arc(V.hx,-V.hy,3.6,0,6.2832); q.fill();
  q.beginPath(); q.arc(V.hx, V.hy,3.6,0,6.2832); q.fill();
})();
</script>
